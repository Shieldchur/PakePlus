<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分数位次转换器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <h1>分数位次转换器</h1>
    <label for="score">分数:</label>
    <input type="number" id="score" placeholder="输入分数">
    <label for="rank">位次:</label>
    <input type="number" id="rank" placeholder="输入位次">
    <button onclick="convert()">匹配</button>
    <div id="result"></div>
    <script>
        async function convert() {
            const score = document.getElementById('score').value;
            const rank = document.getElementById('rank').value;
            const resultDiv = document.getElementById('result');
            if ((score && rank) || (!score &&!rank)) {
                resultDiv.textContent = '请只填写分数或位次其中一项';
                return;
            }
            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ score: score || null, rank: rank || null })
                });
                const data = await response.json();
                if (data.error) {
                    resultDiv.textContent = data.error;
                } else {
                    resultDiv.textContent = `转换结果: ${data.result}`;
                }
            } catch (error) {
                resultDiv.textContent = '发生错误，请重试';
            }
        }
    </script>
</body>
</html>
